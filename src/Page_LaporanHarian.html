<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('Style'); ?>
</head>
<body>
  <button class="mobile-menu" aria-label="Buka menu">&#9776;</button>
  <div class="app-shell">
    <?!= include('Sidebar', {activePage: 'laporan-harian', scriptUrl: scriptUrl}); ?>
    <main class="main-area">
      <?!= include('Topbar', {
        title: 'LAPORAN HARIAN',
        subtitle: 'Ringkasan & eksplorasi laporan harian tim',
        eyebrow: 'LAPORAN HARIAN',
        sectionTitle: 'Ringkasan hari ini & kemarin, eksplorasi seluruh riwayat',
        note: 'Data dibaca langsung (read-only) dari spreadsheet MASTER LAPORAN HARIAN.',
        showActions: true
      }); ?>

      <div class="stats-grid four" id="kpiRow"></div>

      <section class="panel">
        <div class="panel-head"><h2>LAPORAN HARI INI PER SUMBER/ORANG</h2><span class="result-count" id="sourceCount">0 sumber</span></div>
        <div class="laporan-source-grid" id="sourceGrid"></div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>AKTIVITAS TERBARU</h2><span class="result-count">Hari ini &amp; kemarin</span></div>
        <div class="laporan-activity-list" id="activityList"></div>
      </section>

      <section class="panel filter-panel">
        <div class="filters">
          <label class="field"><span>Dari</span><input type="date" id="fFrom"></label>
          <label class="field"><span>Sampai</span><input type="date" id="fTo"></label>
          <label class="field"><span>Sumber</span><select id="fSource"><option value="ALL">Semua Sumber</option></select></label>
          <label class="field search-field"><span>Cari kegiatan/keterangan</span><input type="text" id="fSearch" placeholder="Ketik kata kunci..."></label>
          <label class="field"><span>Keterangan</span>
            <select id="fNote"><option value="ALL">Semua</option><option value="WITH_NOTE">Ada Keterangan</option><option value="WITHOUT_NOTE">Kosong</option></select>
          </label>
          <button class="btn reset" id="btnReset">&#8635; Reset</button>
        </div>
      </section>

      <section class="panel table-panel">
        <div class="panel-head"><h2>EKSPLORASI LAPORAN</h2><span class="result-count" id="tableCount">0 laporan</span></div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Tanggal Laporan</th><th>Nama Area/Sumber</th><th>Kegiatan</th><th>Keterangan</th><th>Waktu Input</th><th>Detail</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div id="emptyState"></div>
        <div class="pager" id="pager"></div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="detailModal" hidden>
    <div class="modal-box">
      <div class="modal-head"><h3>Detail Laporan</h3><button class="modal-close" id="detailClose" aria-label="Tutup">&times;</button></div>
      <div class="modal-body">
        <div class="modal-field"><span>Tanggal Laporan</span><strong id="dTanggal"></strong></div>
        <div class="modal-field"><span>Nama Area/Sumber</span><strong id="dSource"></strong></div>
        <div class="modal-field"><span>Kegiatan</span><strong id="dKegiatan"></strong></div>
        <div class="modal-field"><span>Keterangan</span><strong id="dKeterangan"></strong></div>
        <div class="modal-field"><span>Waktu Input</span><strong id="dWaktu"></strong></div>
      </div>
      <div class="modal-foot"><button class="btn reset" id="detailCloseFoot">Tutup</button></div>
    </div>
  </div>

  <?!= include('ClientScript'); ?>
  <script>
    var state = { dateFrom: '', dateTo: '', source: 'ALL', search: '', noteStatus: 'ALL', page: 1 };
    var optionsLoaded = false;
    var currentPageRows = []; // baris tabel halaman saat ini — dipakai tombol Detail, tanpa panggilan server tambahan

    function currentFilters() { return Object.assign({}, state); }

    function fillOptions(opts) {
      if (optionsLoaded) return;
      optionsLoaded = true;
      var sel = document.getElementById('fSource');
      opts.sources.forEach(function (s) { sel.innerHTML += '<option value="' + App.esc(s) + '">' + App.esc(s) + '</option>'; });
    }

    function kpiCard(icon, label, value, small) {
      return '<article class="stat-card"><div class="stat-icon ' + icon.cls + '">' + icon.txt + '</div>' +
        '<div><span>' + App.esc(label) + '</span><strong>' + value + '</strong><small>' + App.esc(small) + '</small></div></article>';
    }

    function renderKeterangan(k) {
      return k ? App.esc(k) : '<span class="laporan-note-empty">(kosong)</span>';
    }

    function render(d) {
      fillOptions(d.filterOptions);
      var k = d.kpi;
      document.getElementById('kpiRow').innerHTML = [
        kpiCard({ cls: 'violet', txt: '&Sigma;' }, 'TOTAL (2 HARI TERAKHIR)', App.fmtAngka(k.totalWindow), 'Hari ini + kemarin'),
        kpiCard({ cls: 'cyan', txt: '&#9673;' }, 'LAPORAN HARI INI', App.fmtAngka(k.totalHariIni), 'Data terakhir: ' + App.esc(k.tanggalTerakhir)),
        kpiCard({ cls: 'yellow', txt: '&#8987;' }, 'LAPORAN KEMARIN', App.fmtAngka(k.totalKemarin), ''),
        kpiCard({ cls: 'purple', txt: '&#128101;' }, 'SUMBER AKTIF (2 HARI)', App.fmtAngka(k.sumberAktifWindow), 'Dari ' + d.filterOptions.sources.length + ' total sumber'),
      ].join('');

      document.getElementById('sourceCount').textContent = d.bySourceToday.length + ' sumber';
      document.getElementById('sourceGrid').innerHTML = d.bySourceToday.map(function (s) {
        var items = s.items.length
          ? s.items.map(function (it) {
              return '<div class="laporan-source-item">' + App.esc(it.kegiatan) + (it.keterangan ? '<small>' + App.esc(it.keterangan) + '</small>' : '') + '</div>';
            }).join('') + (s.truncated ? '<div class="laporan-source-more">+ lainnya&hellip;</div>' : '')
          : '<div class="laporan-source-empty">Belum ada laporan hari ini.</div>';
        return '<div class="laporan-source-card"><div class="laporan-source-head"><strong>' + App.esc(s.source) + '</strong>' +
          '<span class="laporan-source-badge">' + s.count + '</span></div>' +
          '<div class="laporan-source-list">' + items + '</div></div>';
      }).join('');

      document.getElementById('activityList').innerHTML = d.recentActivities.length
        ? d.recentActivities.map(function (r) {
            return '<div class="laporan-activity-item"><div class="laporan-activity-date">' + r.tanggal + '</div>' +
              '<div class="laporan-activity-body"><strong>' + App.esc(r.kegiatan) + '</strong>' +
              '<small>' + App.esc(r.source) + ' &middot; ' + r.waktuInput + '</small></div></div>';
          }).join('')
        : '<div class="empty-state">Belum ada aktivitas hari ini/kemarin.</div>';

      document.getElementById('tableCount').textContent = d.table.total + ' laporan';
      currentPageRows = d.table.rows;
      document.getElementById('tbody').innerHTML = d.table.rows.map(function (r, i) {
        return '<tr><td>' + r.tanggal + '</td><td>' + App.esc(r.source) + '</td>' +
          '<td class="location">' + App.esc(r.kegiatan) + '</td><td class="location">' + renderKeterangan(r.keterangan) + '</td>' +
          '<td>' + r.waktuInput + '</td><td><button class="laporan-detail-btn" onclick="openDetail(' + i + ')">Lihat</button></td></tr>';
      }).join('');
      document.getElementById('emptyState').innerHTML = d.table.total === 0
        ? '<div class="empty-state">Tidak ada laporan yang sesuai filter.</div>' : '';
      renderPager(d.table);
    }

    function renderPager(t) {
      document.getElementById('pager').innerHTML =
        '<button ' + (t.page <= 1 ? 'disabled' : '') + ' onclick="changePage(' + (t.page - 1) + ')">&lsaquo;</button>' +
        '<span>Halaman ' + t.page + ' dari ' + t.totalPages + '</span>' +
        '<button ' + (t.page >= t.totalPages ? 'disabled' : '') + ' onclick="changePage(' + (t.page + 1) + ')">&rsaquo;</button>';
    }
    function changePage(p) { state.page = p; reload(); }

    function openDetail(i) {
      var r = currentPageRows[i];
      if (!r) return;
      document.getElementById('dTanggal').textContent = r.tanggal;
      document.getElementById('dSource').textContent = r.source;
      document.getElementById('dKegiatan').textContent = r.kegiatan;
      document.getElementById('dKeterangan').textContent = r.keterangan || '(kosong)';
      document.getElementById('dWaktu').textContent = r.waktuInput;
      document.getElementById('detailModal').hidden = false;
    }
    function closeDetail() { document.getElementById('detailModal').hidden = true; }
    document.getElementById('detailClose').addEventListener('click', closeDetail);
    document.getElementById('detailCloseFoot').addEventListener('click', closeDetail);
    document.getElementById('detailModal').addEventListener('click', function (e) {
      if (e.target === this) closeDetail();
    });

    function reload(force) {
      var f = currentFilters(); f.forceRefresh = !!force;
      return App.call('apiGetLaporanHarian', f).then(render);
    }

    document.getElementById('fFrom').addEventListener('change', function () { state.dateFrom = this.value; state.page = 1; reload(); });
    document.getElementById('fTo').addEventListener('change', function () { state.dateTo = this.value; state.page = 1; reload(); });
    document.getElementById('fSource').addEventListener('change', function () { state.source = this.value; state.page = 1; reload(); });
    document.getElementById('fNote').addEventListener('change', function () { state.noteStatus = this.value; state.page = 1; reload(); });
    document.getElementById('fSearch').addEventListener('input', App.debounce(function () { state.search = this.value; state.page = 1; reload(); }, 400));
    document.getElementById('btnReset').addEventListener('click', function () {
      state = { dateFrom: '', dateTo: '', source: 'ALL', search: '', noteStatus: 'ALL', page: 1 };
      document.getElementById('fFrom').value = ''; document.getElementById('fTo').value = '';
      document.getElementById('fSource').value = 'ALL'; document.getElementById('fNote').value = 'ALL';
      document.getElementById('fSearch').value = '';
      reload();
    });

    App.setupExport('laporan_harian', currentFilters);
    App.setupPolling(reload);
  </script>
</body>
</html>
