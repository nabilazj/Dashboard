<script>
  /**
   * Runtime kecil yang dipakai bareng oleh semua halaman (Page_*.html).
   * Semua komunikasi ke server lewat google.script.run (bukan fetch),
   * karena ini pola resmi & paling stabil untuk Apps Script HtmlService.
   */
  var App = (function () {
    function fmtRupiah(n) {
      n = Math.round(Number(n) || 0);
      var neg = n < 0; n = Math.abs(n);
      var s = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return (neg ? '-Rp ' : 'Rp ') + s;
    }
    function fmtAngka(n) {
      n = Math.round(Number(n) || 0);
      return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }
    function esc(s) {
      return String(s === null || s === undefined ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function debounce(fn, wait) {
      var t;
      return function () {
        var args = arguments, ctx = this;
        clearTimeout(t);
        t = setTimeout(function () { fn.apply(ctx, args); }, wait || 350);
      };
    }
    function call(fnName, args) {
      return new Promise(function (resolve, reject) {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (err) { reject(err); })
          [fnName](args);
      });
    }

    function downloadBlob(filename, blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    }
    function downloadText(filename, text, mime) {
      downloadBlob(filename, new Blob([text], { type: mime || 'text/csv;charset=utf-8;' }));
    }
    function downloadBase64(filename, base64, mime) {
      var bin = atob(base64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      downloadBlob(filename, new Blob([bytes], { type: mime || 'application/pdf' }));
    }

    /** Pasang tombol Ekspor CSV/PDF di topbar untuk halaman `pageName`, dgn filter dari getFilters(). */
    function setupExport(pageName, getFilters) {
      window.__exportCsv = function () {
        setSyncLabel_('Menyiapkan CSV&hellip;');
        google.script.run
          .withSuccessHandler(function (res) {
            downloadText(res.filename, res.csv);
            setSyncLabel_('CSV terunduh');
          })
          .withFailureHandler(function (err) { alert('Gagal ekspor CSV: ' + err.message); setSyncLabel_('Gagal ekspor'); })
          .apiExportCsv(pageName, getFilters());
      };
      window.__exportPdf = function () {
        setSyncLabel_('Menyiapkan PDF&hellip; (bisa beberapa detik)');
        google.script.run
          .withSuccessHandler(function (res) {
            downloadBase64(res.filename, res.base64, 'application/pdf');
            setSyncLabel_('PDF terunduh');
          })
          .withFailureHandler(function (err) { alert('Gagal ekspor PDF: ' + err.message); setSyncLabel_('Gagal ekspor'); })
          .apiExportPdf(pageName, getFilters());
      };
    }

    function setSyncLabel_(html) {
      var el = document.getElementById('syncLabel');
      if (el) el.innerHTML = html;
    }
    function setSyncDot_(ok) {
      var el = document.getElementById('syncDot');
      if (el) el.className = ok ? 'live-dot' : 'fallback-dot';
    }

    /**
     * Tema terang/gelap. Nilai AWAL sudah diterapkan lebih dulu oleh script
     * kecil di Style.html (di <head>, sebelum <body> dirender, supaya tidak
     * kedip) — fungsi di sini cuma urusan TOMBOL toggle-nya & menyimpan
     * pilihan user ke localStorage supaya diingat utk kunjungan berikutnya.
     */
    function currentTheme_() {
      return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    }
    function syncThemeToggleUI_() {
      var dark = currentTheme_() === 'dark';
      var icon = document.getElementById('themeToggleIcon');
      var btn = document.getElementById('themeToggle');
      if (icon) icon.innerHTML = dark ? '&#9728;' : '&#9789;'; // matahari (klik = ke terang) / bulan (klik = ke gelap)
      if (btn) btn.title = dark ? 'Ganti ke mode terang' : 'Ganti ke mode gelap';
    }
    function toggleTheme() {
      var next = currentTheme_() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('rmp_theme', next); } catch (e) {}
      syncThemeToggleUI_();
    }

    /** Overlay "Memuat data..." full-layar supaya loading pertama kali tidak terasa seperti layar kosong/macet. */
    function ensureLoader_() {
      if (document.getElementById('pageLoader')) return;
      var el = document.createElement('div');
      el.id = 'pageLoader';
      el.className = 'page-loader';
      el.innerHTML = '<div class="page-loader-spinner"></div><span>Memuat data&hellip;</span>';
      document.body.appendChild(el);
    }
    function hideLoader_() {
      var el = document.getElementById('pageLoader');
      if (!el) return;
      el.classList.add('hide');
      setTimeout(function () { el.remove(); }, 300);
    }

    /**
     * Jalankan loadFn(forceRefresh) sekarang, lalu ulangi tiap 60 detik
     * (meniru perilaku polling versi asli), plus saat tab kembali aktif.
     * loadFn HARUS mengembalikan Promise dan menerima 1 argumen boolean
     * `forceRefresh` yang diteruskan sebagai filters.forceRefresh ke server
     * (lihat Cache.gs) — dipakai oleh tombol "Perbarui data sekarang" di
     * topbar supaya klik manual SELALU melewati cache sementara, sementara
     * polling otomatis tiap 60 detik boleh kena cache hit (lebih cepat).
     */
    function setupPolling(loadFn) {
      var running = false;
      var firstRunDone = false;
      function run(force) {
        if (running) return;
        running = true;
        if (force) setSyncLabel_('Memperbarui data&hellip;');
        loadFn(!!force)
          .then(function () {
            setSyncDot_(true);
            setSyncLabel_('MASTER DATA &middot; ' + new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }));
          })
          .catch(function (err) {
            setSyncDot_(false);
            // Tampilkan PESAN ERROR ASLINYA (bukan cuma "Gagal memuat data"
            // generik) — supaya kalau ada masalah (mis. izin/otorisasi belum
            // di-approve setelah menambah fitur baru, kuota, dll), Anda bisa
            // langsung lihat penyebabnya tanpa perlu buka Console (F12).
            var msg = (err && err.message) ? String(err.message) : 'tidak diketahui';
            setSyncLabel_('Gagal memuat data: ' + App.esc(msg));
            var btn = document.getElementById('syncBtn');
            if (btn) btn.title = 'Gagal memuat data — ' + msg + ' (klik utk coba lagi)';
            console.error(err);
          })
          .then(function () {
            running = false;
            // Overlay loading cuma utk pemuatan PERTAMA di halaman ini —
            // sesudahnya (polling 60 detik / klik "Perbarui") data lama tetap
            // tampil sampai data baru datang, tidak perlu menutupi layar lagi.
            if (!firstRunDone) { firstRunDone = true; hideLoader_(); }
          });
      }
      ensureLoader_();
      window.__refreshNow = run;
      run(false);
      setInterval(function () { run(false); }, 60000);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') run(false);
      });
    }

    syncThemeToggleUI_();

    return {
      fmtRupiah: fmtRupiah, fmtAngka: fmtAngka, esc: esc, debounce: debounce,
      call: call, downloadText: downloadText, downloadBase64: downloadBase64,
      setupExport: setupExport, setupPolling: setupPolling, toggleTheme: toggleTheme,
    };
  })();
</script>
